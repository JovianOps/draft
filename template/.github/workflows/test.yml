name: Test
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - run: composer validate --strict
      - run: find . -path ./build -prune -o -path ./vendor -prune -o -name '*.php' -print | xargs -n1 php -l

  test:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, curl, zip, gd, pdo_sqlite, sqlite3
          tools: composer:v2
      - run: php bin/assemble.php
      - run: php bin/test.php
