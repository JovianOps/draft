# Dependabot: weekly minor/patch groups, majors solo, Jakarta mornings.
# NOTE: no composer block for template/ — its composer.json holds {{TOKENS}}
# until scaffolded, which the updater cannot parse. Template deps update
# when a maintainer scaffolds and runs composer update there.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Jakarta
    groups:
      actions-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    labels: [dependencies, ci]
    commit-message:
      prefix: chore
    open-pull-requests-limit: 5

  - package-ecosystem: composer
    directory: /template
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Jakarta
    groups:
      php-minor-patch:
        patterns: ["*"]
        update-types: [minor, patch]
    labels: [dependencies, php]
    commit-message:
      prefix: chore
      include: scope
    open-pull-requests-limit: 10
